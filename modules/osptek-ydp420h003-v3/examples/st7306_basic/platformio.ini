[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Override these values for the board and wiring actually in use.
build_flags =
  -D OSPTEK_PIN_SCLK=12
  -D OSPTEK_PIN_MOSI=11
  -D OSPTEK_PIN_CS=10
  -D OSPTEK_PIN_DC=9
  -D OSPTEK_PIN_RESET=4
  -D OSPTEK_PIN_TE=5
