; ============================================================
;  模组驱动示例模板（复制到 modules/<slug>/examples/<name>/ 使用）
;  模组本身不能独立运行，需配一块核心板/开发板，故这里 board 选一块
;  支持该模组接口的开发板作为载体（ingest 时按实际情况填写）。
; ============================================================
[platformio]
default_envs = carrier

[env:carrier]
platform   = espressif32@<版本或 latest>
board      = <承载板的 pio board id>
framework  = arduino
monitor_speed = 115200

build_flags =
  -D SDA_PIN=12
  -D SCL_PIN=11
