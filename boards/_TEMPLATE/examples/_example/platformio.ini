; ============================================================
;  PlatformIO 示例工程模板（复制到 boards/<slug>/examples/<name>/ 使用）
;  复制后：改 platformio.ini 里的 board / 环境，写 src/main.cpp
; ============================================================
[platformio]
default_envs = default

[env:default]
; ---- 按板子主控芯片选 platform / board ----
platform   = espressif32@<版本或 latest>   ; ESP32 系列用 espressif32；RP2040 用 raspberrypi
board      = <pio-board-id>                ; 如 m5stack-timer-cam / esp32-s3-devkitc-1
framework  = arduino                       ; 或 espidf
monitor_speed = 115200
upload_speed  = 921600

; ---- 如需指定引脚，集中在这里，main.cpp 里 extern 引用 ----
build_flags =
  -D LED_PIN=2
  ; -D UART_TX=43
  ; -D UART_RX=44
