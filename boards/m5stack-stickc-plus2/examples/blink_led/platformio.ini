[platformio]
default_envs = stickc-plus2

; 官方推荐配置（见 Plus2 文档 PlatformIO 段）
[env:stickc-plus2]
platform   = espressif32@6.7.0
; 官方 Plus2 文档使用 m5stick-c，并用下方选项覆盖 Plus2 的 8MB Flash / 2MB PSRAM。
board      = m5stick-c
framework  = arduino
monitor_speed = 115200
upload_speed  = 1500000
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs
board_upload.flash_size = 8MB

build_flags =
  -D LED_PIN=19                   ; 板载红色 LED（与 IR 共用 G19）
  -DBOARD_HAS_PSRAM               ; ESP32-PICO-V3-02 带 2MB PSRAM
  -mfix-esp32-psram-cache-issue
