[platformio]
default_envs = stackchan

[env:stackchan]
platform   = espressif32@6.7.0
board      = m5stack-cores3           ; PlatformIO 内置 CoreS3 board id（StackChan 主控即 CoreS3）
framework  = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
  -D I2C_SDA=12                     ; 本体 I2C 数据线 G12（与 CoreS3 板内器件共线）
  -D I2C_SCL=11                     ; 本体 I2C 时钟线 G11
