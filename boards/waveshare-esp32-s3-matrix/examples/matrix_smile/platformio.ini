[platformio]
default_envs = matrix

[env:matrix]
platform   = espressif32@6.7.0
board      = esp32-s3-devkitc-1   ; 通用 ESP32-S3；Waveshare 暂无专用 board id
board_build.flash_size = 4MB
; ⚠️ 注意：esp32-s3-devkitc-1 实为 -N8(8MB)，其 upload.flash_size=8MB 会把镜像头写成 8MB，
;    在本板(4MB)上 boot loop（board_build.flash_size 无效）。真正在板子上跑需自定义 4MB board JSON
;    + esptool --no-stub 烧录（见板子页「特殊说明」坑1/坑2 / raw 踩坑流水）。本示例仅作 API 演示。
framework  = arduino
monitor_speed = 115200
upload_speed  = 921600

build_flags =
  -D MATRIX_PIN=14                 ; 8x8 WS2812 矩阵数据脚 (PIN_NEOPIXEL)
  -D MATRIX_W=8
  -D MATRIX_H=8
  -D LED_BUILTIN=14
  ; Adafruit_NeoPixel 库通过 lib_deps 引入
lib_deps =
  adafruit/Adafruit NeoPixel @ ^1.12.0
